spring.application.name=intern

# ==========================================
# 1. DATABASE CONFIGURATION (Secured)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# 🚀 Phase 1 Fix: HikariCP Database Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# 2. FILE STORAGE CONFIGURATION
# ==========================================
file.upload-dir=D:/uploads/notes/
file.result-dir=D:/uploads/results/

# Multipart Limits & Temp Storage
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=/tmp/tomcat-uploads

# ==========================================
# 3. SECURITY CONFIGURATION (Secured)
# ==========================================
# Using Environment Variables with local fallbacks to prevent GitHub credential leaks
spring.security.user.name=${ADMIN_USERNAME}
spring.security.user.password=${ADMIN_PASSWORD}

# JWT Signing Key (To be injected via environment variable in production)
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400000