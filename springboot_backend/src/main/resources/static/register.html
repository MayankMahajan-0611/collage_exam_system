<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IntelliGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); min-height: 100vh; } .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }</style>
</head>
<body class="flex items-center justify-center p-6">

<div class="glass-card w-full max-w-2xl rounded-3xl p-10 border border-white">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4"><i class="fa-solid fa-user-plus text-2xl"></i></div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Join IntelliGen</h1>
    </div>

    <form onsubmit="handleRegister(event)" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div><label class="block text-sm font-bold text-slate-700 mb-1">Full Name</label><input type="text" id="regName" required class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500"></div>
            <div><label class="block text-sm font-bold text-slate-700 mb-1">Email Address</label><input type="email" id="regEmail" required class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div><label class="block text-sm font-bold text-slate-700 mb-1">Password</label><input type="password" id="regPassword" required minlength="6" class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500"></div>
            <div><label class="block text-sm font-bold text-slate-700 mb-1">College Name</label><input type="text" id="regCollege" required class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500"></div>
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">I am a...</label>
            <select id="roleSelect" onchange="toggleDynamicFields()" required class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500 text-blue-700 cursor-pointer">
                <option value="" disabled selected>Select your role</option>
                <option value="STUDENT">Student</option>
                <option value="TEACHER">Teacher</option>
                <option value="PRINCIPAL">Principal</option>
            </select>
        </div>

        <div id="dynamicFields" class="bg-slate-50 p-5 rounded-2xl border hidden space-y-4 mt-4">
            <div id="deptContainer" class="hidden">
                <label class="block text-sm font-bold text-slate-700 mb-1">Department / Branch</label>
                <input type="text" id="regDept" class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500" placeholder="e.g. Computer Science">
            </div>

            <div id="studentFields" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                <div><label class="block text-sm font-bold text-slate-700 mb-1">Roll Number</label><input type="text" id="regRoll" class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500"></div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Semester</label>
                    <select id="regSemester" class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500 bg-white">
                        <option value="">Select Semester...</option><option value="1">Semester 1</option><option value="2">Semester 2</option><option value="3">Semester 3</option><option value="4">Semester 4</option><option value="5">Semester 5</option><option value="6">Semester 6</option><option value="7">Semester 7</option><option value="8">Semester 8</option>
                    </select>
                </div>
            </div>

            <div id="teacherFields" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Employee ID</label>
                    <input type="text" id="regEmpId" class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Subjects Taught (Comma Separated)</label>
                    <input type="text" id="regSubjects" class="w-full rounded-xl border px-4 py-3 outline-none focus:border-blue-500" placeholder="e.g. Database Systems, Machine Learning">
                </div>
            </div>
        </div>

        <p id="errorMsg" class="text-red-500 text-sm font-bold text-center hidden bg-red-50 p-3 rounded-lg border border-red-200"></p>
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all mt-4">Create Account</button>
        <p class="text-center text-slate-500 mt-6 text-sm">Already have an account? <a href="login.html" class="text-blue-600 font-bold hover:underline">Log in here</a></p>
    </form>
</div>

<script>
    function toggleDynamicFields() {
        const role = document.getElementById('roleSelect').value;
        const container = document.getElementById('dynamicFields');
        document.getElementById('deptContainer').classList.add('hidden'); document.getElementById('studentFields').classList.add('hidden'); document.getElementById('teacherFields').classList.add('hidden');

        document.getElementById('regDept').required = false; document.getElementById('regRoll').required = false; document.getElementById('regSemester').required = false; document.getElementById('regEmpId').required = false;

        if(role === 'PRINCIPAL') { container.classList.add('hidden'); return; }
        container.classList.remove('hidden'); document.getElementById('deptContainer').classList.remove('hidden'); document.getElementById('regDept').required = true;

        if (role === 'STUDENT') { document.getElementById('studentFields').classList.remove('hidden'); document.getElementById('regRoll').required = true; document.getElementById('regSemester').required = true; }
        else if (role === 'TEACHER') { document.getElementById('teacherFields').classList.remove('hidden'); document.getElementById('regEmpId').required = true; }
    }

    async function handleRegister(event) {
        event.preventDefault();
        const btn = document.getElementById('submitBtn'); btn.innerHTML = 'Registering...'; btn.disabled = true;

        const role = document.getElementById('roleSelect').value;
        const payload = {
            name: document.getElementById('regName').value, username: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value, collegeName: document.getElementById('regCollege').value, role: role
        };

        if (role === 'STUDENT') {
            payload.departmentName = document.getElementById('regDept').value; payload.rollNo = document.getElementById('regRoll').value; payload.currentSemester = parseInt(document.getElementById('regSemester').value);
        } else if (role === 'TEACHER') {
            payload.departmentName = document.getElementById('regDept').value; payload.employeeId = document.getElementById('regEmpId').value;
            payload.subjects = document.getElementById('regSubjects').value; // Collect Subjects
        }

        try {
            const response = await fetch('http://localhost:8080/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await response.json();
            if (response.ok) { alert(data.message); window.location.replace('login.html'); } else { document.getElementById('errorMsg').innerText = data.error; document.getElementById('errorMsg').classList.remove('hidden'); }
        } catch (error) { document.getElementById('errorMsg').innerText = "Server Error"; document.getElementById('errorMsg').classList.remove('hidden'); }
        finally { btn.innerHTML = 'Create Account'; btn.disabled = false; }
    }
</script>
</body>
</html>
