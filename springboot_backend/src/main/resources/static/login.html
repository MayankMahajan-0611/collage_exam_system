<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IntelliGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center p-6">

<div class="glass-card w-full max-w-md rounded-3xl p-10 border border-white">

    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
            <i class="fa-solid fa-right-to-bracket text-2xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
        <p class="text-slate-500 mt-2">Sign in to your IntelliGen account.</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-5">

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-envelope text-slate-400"></i>
                </div>
                <input type="email" id="email" required class="w-full rounded-xl border border-slate-200 pl-11 pr-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all" placeholder="name@college.edu">
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Password</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-lock text-slate-400"></i>
                </div>
                <input type="password" id="password" required class="w-full rounded-xl border border-slate-200 pl-11 pr-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all" placeholder="••••••••">
            </div>
        </div>

        <!-- Error Message Container (Will display suspension / approval messages) -->
        <p id="errorMsg" class="text-red-500 text-sm font-bold text-center hidden bg-red-50 p-3 rounded-lg border border-red-200"></p>

        <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-xl mt-2">
            Sign In
        </button>

        <p class="text-center text-slate-500 mt-6 text-sm">
            Don't have an account yet? <a href="register.html" class="text-blue-600 font-bold hover:underline">Register here</a>
        </p>
    </form>
</div>

<script>
    // Clear any existing session when hitting the login page
    localStorage.removeItem('currentUser');

    async function handleLogin(event) {
        event.preventDefault();

        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const username = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Signing in...';
        btn.disabled = true;
        errorMsg.classList.add('hidden');

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Save user session securely
                localStorage.setItem('currentUser', JSON.stringify(data));

                // Route to correct dashboard based on backend role
                if (data.role === 'ADMIN') {
                    window.location.replace('admin-dashboard.html');
                } else if (data.role === 'PRINCIPAL') {
                    window.location.replace('principal-dashboard.html');
                } else if (data.role === 'HOD') {
                    // 🚨 FIXED: Route HOD directly to their branch-isolated operational dashboard
                    window.location.replace('hod-dashboard.html');
                } else if (data.role === 'TEACHER') {
                    window.location.replace('teacher-dashboard.html');
                } else {
                    window.location.replace('student-exam.html');
                }
            } else {
                // Displays "Your account has been suspended by the Administrator." or other backend errors
                errorMsg.innerText = data.error || "Invalid credentials.";
                errorMsg.classList.remove('hidden');
            }
        } catch (error) {
            errorMsg.innerText = "Server connection failed. Is the Spring Boot backend running?";
            errorMsg.classList.remove('hidden');
        } finally {
            btn.innerHTML = 'Sign In';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
