<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Examination | IGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .unselectable { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    </style>
</head>
<body class="p-4 md:p-8 unselectable">

<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <span id="subjectBadge" class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">Loading Subject...</span>
            <h1 id="examTitle" class="text-2xl font-extrabold text-slate-900 mt-2">Loading Examination...</h1>
        </div>
        <div class="flex items-center gap-3 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-md self-stretch md:self-auto justify-center">
            <i class="fa-regular fa-clock text-xl text-amber-400 fa-pulse"></i>
            <div>
                <p class="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Time Remaining</p>
                <p id="timeDisplay" class="text-xl font-black font-mono">00:00</p>
            </div>
        </div>
    </div>

    <form id="submissionForm" onsubmit="handleExamSubmit(event)">
        <div id="questionsContainer" class="space-y-6">
            <p class="text-slate-500 text-center py-12"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading question paper securely...</p>
        </div>

        <div class="mt-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p class="text-xs font-semibold text-slate-500"><i class="fa-solid fa-circle-info mr-1.5 text-blue-500"></i>Ensure all answers are checked. You cannot modify choices after submission.</p>
            <button type="submit" id="submitExamBtn" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Submit Answer Sheet
            </button>
        </div>
    </form>
</div>

<script>
    // --- Parse Query Parameters ---
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('id');
    const rollNo = urlParams.get('rollNo');
    const userSession = JSON.parse(localStorage.getItem('currentUser'));

    if (!examId || !rollNo || !userSession) {
        alert("Invalid test session initialization configuration context.");
        window.location.replace('student-exam.html');
    }

    let examTimer = null;
    let totalSecondsLeft = 0;

    // --- Fetch Exam Paper ---
    async function fetchQuestionPaper() {
        try {
            const res = await fetch(`http://localhost:8080/api/exam/student/take/${examId}?rollNo=${encodeURIComponent(rollNo)}`);

            if (!res.ok) {
                const err = await res.json();
                document.getElementById('questionsContainer').innerHTML = `
                    <div class="bg-red-50 text-red-700 p-6 rounded-xl border border-red-200 text-center font-bold">
                        <i class="fa-solid fa-circle-xmark text-3xl mb-2"></i>
                        <p>${err.error || "Access Denied."}</p>
                        <button onclick="window.location.replace('student-exam.html')" class="mt-4 bg-slate-800 text-white px-4 py-2 rounded-lg text-sm">Return to Dashboard</button>
                    </div>`;
                return;
            }

            const exam = await res.json();

            // Render basic details
            document.getElementById('examTitle').innerText = exam.title;
            document.getElementById('subjectBadge').innerText = exam.subjectName || "General Assessment";

            // Initialize Timer
            totalSecondsLeft = (exam.durationMinutes || 30) * 60;
            startCountdown();

            // Render Questions
            const container = document.getElementById('questionsContainer');
            if (!exam.questions || exam.questions.length === 0) {
                container.innerHTML = '<p class="text-center py-6 text-slate-500 font-bold">This test contains no questions.</p>';
                return;
            }

            container.innerHTML = exam.questions.map((q, i) => {
                const optionsHtml = q.options.map((opt, oIdx) => `
                    <label class="flex items-center gap-3 p-3.5 border border-slate-200 rounded-xl hover:bg-slate-50 cursor-pointer transition-all focus-within:ring-2 focus-within:ring-blue-100">
                        <input type="radio" name="question_${q.id}" value="${opt}" required class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
                        <span class="text-sm font-medium text-slate-700">${opt}</span>
                    </label>
                `).join('');

                return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-start gap-4 mb-4">
                            <span class="font-bold text-slate-400 text-sm font-mono">QUESTION ${i + 1}</span>
                            <span class="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md border">${q.marks || 1} Mark(s)</span>
                        </div>
                        <p class="font-semibold text-slate-800 mb-4 text-base">${q.questionText}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error(error);
        }
    }

    // --- Timer Engine ---
    function startCountdown() {
        examTimer = setInterval(() => {
            if (totalSecondsLeft <= 0) {
                clearInterval(examTimer);
                alert("Time is up! Your answer sheet is being auto-submitted.");
                document.getElementById('submissionForm').requestSubmit();
            } else {
                totalSecondsLeft--;
                const mins = Math.floor(totalSecondsLeft / 60);
                const secs = totalSecondsLeft % 60;
                document.getElementById('timeDisplay').innerText =
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                // Visual Alert for last 2 minutes
                if (totalSecondsLeft < 120) {
                    document.getElementById('timeDisplay').classList.add('text-red-500', 'animate-pulse');
                }
            }
        }, 1000);
    }

    // --- Form Submission Handler ---
    async function handleExamSubmit(event) {
        event.preventDefault();
        clearInterval(examTimer);

        const btn = document.getElementById('submitExamBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Saving responses...';
        btn.disabled = true;

        // Bundle form responses into map
        const answersMap = {};
        const formData = new FormData(event.target);
        for (let [key, value] of formData.entries()) {
            if (key.startsWith('question_')) {
                const qId = key.split('_')[1];
                answersMap[qId] = value;
            }
        }

        try {
            const response = await fetch(`http://localhost:8080/api/exam/student/submit/${examId}?studentName=${encodeURIComponent(userSession.username)}&rollNo=${encodeURIComponent(rollNo)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(answersMap)
            });

            if (response.ok) {
                alert("Examination submitted successfully!");
                window.location.replace('student-exam.html');
            } else {
                alert("Error recording performance file. Please alert the examiner.");
            }
        } catch (error) {
            alert("Network dropped during submission protocol fallback loop.");
        }
    }

    // Initialize Page Execution
    fetchQuestionPaper();
</script>
</body>
</html>
