<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | IGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #f8fafc; }</style>
    <script>
        const u = JSON.parse(localStorage.getItem('currentUser'));
        if (!u || u.role !== 'STUDENT') window.location.replace('login.html');
    </script>
</head>
<body class="p-8">

<div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-10">
        <div>
            <h1 class="text-3xl font-bold text-slate-900">Student Portal</h1>
            <p id="welcomeMsg" class="text-blue-600 font-bold mt-1 text-lg"></p>
        </div>
        <button onclick="localStorage.removeItem('currentUser'); window.location.replace('login.html');" class="bg-red-50 hover:bg-red-100 transition-colors text-red-600 px-4 py-2 rounded-lg font-bold">Logout</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div>
            <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Available Exams</h2>
            <div id="availableExams" class="space-y-4">
                <p class="text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading your targeted exams...</p>
            </div>
        </div>

        <div>
            <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">My Past Results</h2>
            <div id="pastResults" class="space-y-4">
                <p class="text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading results...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('currentUser'));
    document.getElementById('welcomeMsg').innerText = `Welcome, ${user.username} (${user.departmentName})`;

    async function loadStudentData() {
        // --- 1. FETCH TARGETED EXAMS ---
        try {
            const examRes = await fetch(`http://localhost:8080/api/exam/student/available?rollNo=${encodeURIComponent(user.rollNo)}`);
            const examDiv = document.getElementById('availableExams');

            if (!examRes.ok) {
                // If the backend throws a 400/403/500 error (like "missing semester")
                const errData = await examRes.json();
                examDiv.innerHTML = `<p class="text-red-600 font-bold bg-red-50 p-4 rounded-xl text-center border border-red-100"><i class="fa-solid fa-circle-exclamation mr-2"></i>${errData.error || "Failed to load exams."}</p>`;
            } else {
                const exams = await examRes.json();

                if(!Array.isArray(exams) || exams.length === 0) {
                    examDiv.innerHTML = `<p class="text-slate-500 font-bold bg-slate-100 p-4 rounded-xl text-center border border-slate-200">No active exams currently available for your class.</p>`;
                } else {
                    // Render the exams, including the new subjectName property
                    examDiv.innerHTML = exams.map(e => `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-blue-400 transition-all">
                            <h3 class="font-bold text-lg text-slate-800 mb-1">${e.title}</h3>
                            <p class="text-xs font-bold text-blue-600 bg-blue-50 inline-block px-2 py-1 rounded-md mb-4">${e.subjectName || 'General Subject'}</p>

                            <div class="flex items-center text-sm text-slate-500 mb-4 font-medium">
                                <i class="fa-regular fa-clock mr-2 text-slate-400"></i> ${e.durationMinutes} Minutes
                            </div>

                            <button onclick="takeExam(${e.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all shadow-md">
                                Start Exam <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    `).join('');
                }
            }
        } catch (err) {
            document.getElementById('availableExams').innerHTML = `<p class="text-red-500 font-bold bg-red-50 p-4 rounded-xl text-center border border-red-200">Network Error. Is the backend running?</p>`;
        }

        // --- 2. FETCH PAST RESULTS ---
        try {
            // Note: The backend searches by studentName, so we send user.username (which maps to name in login)
            const resRes = await fetch(`http://localhost:8080/api/exam/results/student/${encodeURIComponent(user.username)}`);
            const resDiv = document.getElementById('pastResults');

            if (!resRes.ok) {
                resDiv.innerHTML = `<p class="text-red-500 font-bold bg-red-50 p-4 rounded-xl text-center">Failed to load results.</p>`;
            } else {
                const results = await resRes.json();

                if(!Array.isArray(results) || results.length === 0) {
                    resDiv.innerHTML = '<p class="text-slate-500 font-bold bg-slate-100 p-4 rounded-xl text-center border border-slate-200">No past results found.</p>';
                } else {
                    resDiv.innerHTML = results.map(r => {
                        const pct = Math.round((r.marksObtained / r.totalMarks) * 100);
                        const isPass = pct >= 40; // Assuming 40% is passing

                        return `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center hover:bg-slate-50 transition-colors">
                            <div>
                                <h3 class="font-bold text-slate-800">${r.examTitle}</h3>
                                <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-calendar-day mr-1"></i>${new Date(r.submissionTime).toLocaleDateString()}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xl font-black text-slate-700">${r.marksObtained}<span class="text-sm text-slate-400 font-bold">/${r.totalMarks}</span></p>
                                <p class="text-xs font-bold ${isPass ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50'} inline-block px-2 py-0.5 rounded-full mt-1">${pct}%</p>
                            </div>
                        </div>
                        `;
                    }).join('');
                }
            }
        } catch (err) {
            document.getElementById('pastResults').innerHTML = `<p class="text-red-500 font-bold bg-red-50 p-4 rounded-xl text-center border border-red-200">Network Error.</p>`;
        }
    }

    function takeExam(id) {
        // Redirect to a dedicated exam-taking UI page
        window.location.href = `exam-player.html?id=${id}&rollNo=${user.rollNo}`;
    }

    loadStudentData();
</script>
</body>
</html>
